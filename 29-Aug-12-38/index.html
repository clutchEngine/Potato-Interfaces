      .logo-and-form {
        margin: auto;
        margin-top: 18vw;
        width: 49vw;

        color: black;

      .logo-and-form .form-container {
        display: flex;
        flex-direction: column;
        background: linear-gradient(to bottom, lightgrey, darkgrey);
      }

      .logo-and-form form {
        width: 80%;

        display: flex;
        justify-content: space-between;
      }

      .logo-and-form form input {
        width: 80%;
        outline: none;
        padding: 3px;
        font-style: normal;
        
          border: 1px solid lightgrey;border-right: none;
      }

      .logo-and-form form #serp-btn {
        width: 18%;
        background: #72b9fc;
        color: white;
        padding: 3px;
        border: none;
        border-radius: 0;
        box-shadow: none;
        transition: 0.1s all ease-in-out;
      }

#mic-btn {background: white; border-radius: 0; border: 1px solid lightgrey; border-left: none;}

      .logo-and-form form button:hover,
      .logo-and-form form button.DEV-hover {
        box-shadow: 1px 1px 0px lightgrey;
      }

      .logo-and-form form button:active,
      .logo-and-form form button.DEV-pressed {
        box-shadow: 1px 1px 0px black;
      }

      a {
        text-decoration: underline;
        user-select: none;
        color: #72b9fc;
      }

      a:hover {
        cursor: pointer;
      }

      
      #weather-apikey,
      #weather-location {
        width: 100px;
      }
